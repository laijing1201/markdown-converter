<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>MarkDoc 注册</title>
  </head>
  <body>
    <!-- 静态跳转壳：JS 环境自动跳转主站并打开注册弹窗；无 JS 环境可点下方链接 -->
    <script>location.replace("./?auth=register")</script>
    <p style="font-family: system-ui, sans-serif; max-width: 480px; margin: 48px auto; line-height: 1.7;">
      <a href="./?auth=register">打开 MarkDoc 注册</a>（注册弹窗随主站加载）。
      注册并验证邮箱后，云端历史随账号保存、导出不限次，网站与浏览器插件共享账号。
    </p>
  </body>
</html>
